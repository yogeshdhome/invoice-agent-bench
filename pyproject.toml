[project]
name = "invoice-agent-bench"
version = "1.0.0"
description = "Baseline vs hardened enterprise AI agent benchmark (synthetic invoice operations)"
requires-python = ">=3.12,<3.13"
readme = "README.md"
# Pins chosen 2026-11-11: latest release that is >=14 days old (supply-chain hygiene).
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.1",
  "pyyaml==6.0.3",
  "httpx==0.28.1",
  "pyjwt==2.15.1",
  "tenacity==9.2.1",
  "structlog==26.1.0",
  "opentelemetry-sdk==1.45.1",
]

[project.optional-dependencies]
agent = [
  "langgraph==1.2.18",
  "langgraph-checkpoint-sqlite==3.1.2",
  "langchain==1.4.7",
  "langchain-core==1.7.0",
  "langchain-openrouter==0.2.9",
]

analysis = ["matplotlib==3.10.0"]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1",
  "hypothesis==6.170.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["llm: requires a real LLM provider (excluded from offline CI)"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
